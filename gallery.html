    <script>
    (function () {
        var tiles = Array.prototype.slice.call(document.querySelectorAll('#grid [data-i]'));
        var full = tiles.map(function (t) { return t.querySelector('img').getAttribute('src').replace('/thumbs/', '/'); });
        var lb = document.getElementById('lightbox'), img = document.getElementById('lb-img'), cnt = document.getElementById('lb-count');
        var i = 0, last = null, sx = null;
        function show(n) {
            i = (n + full.length) % full.length;
            img.src = full[i]; img.alt = 'An Tigín Gallery Image ' + (i + 1);
            cnt.textContent = (i + 1) + ' / ' + full.length;
            [i + 1, i - 1].forEach(function (k) { new Image().src = full[(k + full.length) % full.length]; });
        }
        function open(n) { last = document.activeElement; show(n); lb.classList.add('open'); document.body.style.overflow = 'hidden'; document.getElementById('lb-close').focus(); }
        function close() { lb.classList.remove('open'); document.body.style.overflow = ''; img.src = ''; if (last) last.focus(); }
        tiles.forEach(function (t) { t.addEventListener('click', function () { open(+t.dataset.i); }); });
        document.getElementById('lb-close').onclick = close;
        document.getElementById('lb-prev').onclick = function (e) { e.stopPropagation(); show(i - 1); };
        document.getElementById('lb-next').onclick = function (e) { e.stopPropagation(); show(i + 1); };
        lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
        document.addEventListener('keydown', function (e) {
            if (!lb.classList.contains('open')) return;
            if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') show(i - 1); else if (e.key === 'ArrowRight') show(i + 1);
        });
        lb.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
        lb.addEventListener('touchend', function (e) {
            if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
            if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1);
        });
    })();
    </script>
