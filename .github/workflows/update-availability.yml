name: Update Airbnb availability
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
env:
  # West Cork Events Google Calendar (public). This is the ONLY place the
  # calendar ID is set; change it here to switch calendars.
  WEST_CORK_CALENDAR_ID: ef7e5a5c01cfaa5f8e8c2f6f57811a3834cc40c5766702ea9dfee975ca5ea82c@group.calendar.google.com
permissions:
  contents: write
concurrency:
  group: availability
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build availability.json
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: python3 scripts/update_availability.py
      - name: Build events.json (public West Cork Events calendar)
        run: |
          pip install --quiet python-dateutil
          python3 scripts/update_events.py
      - name: Commit if changed
        run: |
          git add -N events.json 2>/dev/null || true
          if git diff --quiet -- availability.json events.json; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add availability.json events.json
          git commit -m "Update availability/events"
          git push
